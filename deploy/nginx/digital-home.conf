# Gateway público do PWA (container `digital-home`, rede Docker `proxy`).
#
# O Cloudflare Tunnel aponta para http://digital-home:80. O nginx entrega o
# build do frontend e encaminha /api para a API Express gerenciada pelo PM2 no
# host, acessível por host.docker.internal (gateway da rede bridge).

# IP real do cliente enviado pela Cloudflare. Sem o cabeçalho (teste local),
# usa o endereço de origem da conexão.
map $http_cf_connecting_ip $pwa_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $pwa_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 3m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API Express no host (PM2). O rate limit usa X-Forwarded-For com o IP real.
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $pwa_client_ip;
        proxy_set_header X-Forwarded-For $pwa_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $pwa_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Service Worker e manifest precisam ser revalidados a cada visita.
    location = /sw.js {
        expires -1;
    }

    location = /registerSW.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        # O mime.types do nginx nao mapeia .webmanifest.
        default_type application/manifest+json;
        expires -1;
    }

    # Assets com hash no nome podem ficar em cache por uma semana.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: rotas do React Router (por exemplo /gestao) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
